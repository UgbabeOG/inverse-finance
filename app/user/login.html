    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('loginform');
            if (form) {
                form.setAttribute('action', '/app/user/login');

                form.addEventListener('submit', async function(e) {
                    e.preventDefault();

                    const successAlert = form.querySelector('.alert-success');
                    const dangerAlert = form.querySelector('.alert-danger');
                    const successText = successAlert ? successAlert.querySelector('p') : null;
                    const dangerText = dangerAlert ? dangerAlert.querySelector('p') : null;
                    const spin = form.querySelector('.formSpin');

                    if (successAlert) successAlert.style.display = 'none';
                    if (dangerAlert) dangerAlert.style.display = 'none';
                    if (spin) spin.style.display = 'inline-block';

                    const email = document.getElementById('username').value;
                    const password = document.getElementById('password').value;

                    if (!email || !password) {
                        if (dangerAlert && dangerText) {
                            dangerText.innerText = 'Please enter your email and password.';
                            dangerAlert.style.display = 'block';
                        }
                        if (spin) spin.style.display = 'none';
                        return;
                    }

                    try {
                        const response = await fetch('/app/user/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email, password })
                        });

                        const result = await response.json();

                        if (spin) spin.style.display = 'none';

                        if (result.success) {
                            if (result.role === 'admin') {
                                localStorage.setItem('adminUser', JSON.stringify(result.user));
                                localStorage.removeItem('loggedInUser'); // clear normal user session
                            } else {
                                localStorage.setItem('loggedInUser', JSON.stringify(result.user));
                                localStorage.removeItem('adminUser'); // clear admin session
                            }
                            window.location.href = result.redirect;
                        } else {
                            if (dangerAlert && dangerText) {
                                dangerText.innerText = result.message || 'Login failed.';
                                dangerAlert.style.display = 'block';
                            }
                        }
                    } catch (err) {
                        if (spin) spin.style.display = 'none';
                        if (dangerAlert && dangerText) {
                            dangerText.innerText = 'Connection error. Please try again.';
                            dangerAlert.style.display = 'block';
                        }
                    }
                });
            }
        });
    </script>
